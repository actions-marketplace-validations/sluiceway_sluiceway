name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Check that dist/ is up to date
        run: |
          if ! bun run check:dist; then
            echo "::error::dist/ does not match the source. Run 'bun run build' and commit the result."
            exit 1
          fi

  smoke:
    # Runs the committed bundle the way a consumer would, on the real node24 runtime.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: scan
        uses: ./
        continue-on-error: true
        with:
          mode: scan

      - name: Expect the stub to fail
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::Expected the scan stub to fail as not implemented yet, got: $OUTCOME"
            exit 1
          fi
