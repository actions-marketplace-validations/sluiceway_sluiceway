<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 120" width="440" height="120" role="img" aria-label="Sluiceway: no stacks yet"><style>.bob{animation:bob 2.6s ease-in-out infinite}.bob2{animation:bob 2.6s ease-in-out -1.1s infinite}.bob3{animation:bob 2.6s ease-in-out -1.9s infinite}@keyframes bob{50%{transform:translateY(-2.5px)}}.hop{animation:hop .9s ease-in-out infinite}.hop2{animation:hop .9s ease-in-out -.3s infinite}.hop3{animation:hop .9s ease-in-out -.6s infinite}@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.wave{animation:wave 3.2s linear infinite}.fast{animation-duration:1.1s}.slow{animation-duration:6s}@keyframes wave{to{transform:translateX(-40px)}}.blink{animation:blink 1s steps(2,start) infinite}@keyframes blink{to{visibility:hidden}}.zz{animation:zz 3s ease-out infinite}.zz2{animation:zz 3s ease-out -1.5s infinite}@keyframes zz{0%{opacity:0;transform:translate(0,4px)}30%{opacity:1}100%{opacity:0;transform:translate(6px,-12px)}}.look{animation:look 4s ease-in-out infinite}@keyframes look{0%,40%{transform:translateX(-2px)}50%,90%{transform:translateX(2px)}100%{transform:translateX(-2px)}}.wag{transform-box:fill-box;transform-origin:0% 100%;animation:wag 1s ease-in-out infinite}@keyframes wag{50%{transform:rotate(-24deg)}}.puff{transform-box:fill-box;transform-origin:center;animation:puff 1.6s ease-in-out infinite}@keyframes puff{50%{transform:scale(1.035,1.01)}}.squirt{animation:squirt 1.2s ease-out infinite}.squirt2{animation:squirt 1.2s ease-out -.6s infinite}@keyframes squirt{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx,-12px),10px)}}.drift{animation:drift 14s linear infinite}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(340px)}}.roll{animation:drift 9s linear infinite}.shake{animation:shake .5s ease-in-out infinite}@keyframes shake{25%{transform:translateX(-1.2px)}75%{transform:translateX(1.2px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0" y="108" width="440" height="12" fill="#30363d"/><path d="M160 108 l5 5 l-3 5 M300 108 l-4 6 M392 108 l3 4 l-2 5" stroke="#8d96a0" stroke-width="1" fill="none"/><g transform="translate(352 108)"><path d="M0 0 v-13 M-5 -4 v-5 M5 -6 v-4" stroke="#3fb950" stroke-width="3.4" stroke-linecap="round"/><path d="M-5 -4 h5 M5 -6 h-5" stroke="#3fb950" stroke-width="2.4"/></g><g class=""><rect x="36" y="20" width="68" height="58" rx="5" fill="#e08a5c"/><path d="M53 22 v54 M70 22 v54 M87 22 v54" stroke="#a85d38" stroke-width="1.4" opacity=".55"/><rect x="36" y="20" width="68" height="58" rx="5" fill="none" stroke="#a85d38" stroke-width="2"/><circle cx="58" cy="44" r="7" fill="#ffffff"/><circle cx="82" cy="44" r="7" fill="#ffffff"/><g class="look"><circle cx="59" cy="44" r="3.2" fill="#1f2328"/><circle cx="83" cy="44" r="3.2" fill="#1f2328"/></g><circle cx="70" cy="61" r="2.6" fill="#1f2328"/></g><rect x="24" y="24" width="12" height="84" rx="2" fill="#8d96a0"/><rect x="104" y="24" width="12" height="84" rx="2" fill="#8d96a0"/><rect x="16" y="16" width="108" height="11" rx="3.5" fill="#8d96a0"/><g transform="translate(70 11)"><g class=""><circle r="7" fill="none" stroke="#e6edf3" stroke-width="2.2"/><path d="M-7 0 h14 M0 -7 v14" stroke="#e6edf3" stroke-width="1.5"/></g></g><text x="146" y="64" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="800" letter-spacing="-1" fill="#e6edf3">sluiceway</text></svg>