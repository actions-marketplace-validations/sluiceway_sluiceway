<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 120" width="440" height="120" role="img" aria-label="Sluiceway: something failed"><style>.bob{animation:bob 2.6s ease-in-out infinite}.bob2{animation:bob 2.6s ease-in-out -1.1s infinite}.bob3{animation:bob 2.6s ease-in-out -1.9s infinite}@keyframes bob{50%{transform:translateY(-2.5px)}}.hop{animation:hop .9s ease-in-out infinite}.hop2{animation:hop .9s ease-in-out -.3s infinite}.hop3{animation:hop .9s ease-in-out -.6s infinite}@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.wave{animation:wave 3.2s linear infinite}.fast{animation-duration:1.1s}.slow{animation-duration:6s}@keyframes wave{to{transform:translateX(-40px)}}.blink{animation:blink 1s steps(2,start) infinite}@keyframes blink{to{visibility:hidden}}.zz{animation:zz 3s ease-out infinite}.zz2{animation:zz 3s ease-out -1.5s infinite}@keyframes zz{0%{opacity:0;transform:translate(0,4px)}30%{opacity:1}100%{opacity:0;transform:translate(6px,-12px)}}.look{animation:look 4s ease-in-out infinite}@keyframes look{0%,40%{transform:translateX(-2px)}50%,90%{transform:translateX(2px)}100%{transform:translateX(-2px)}}.wag{transform-box:fill-box;transform-origin:0% 100%;animation:wag 1s ease-in-out infinite}@keyframes wag{50%{transform:rotate(-24deg)}}.puff{transform-box:fill-box;transform-origin:center;animation:puff 1.6s ease-in-out infinite}@keyframes puff{50%{transform:scale(1.035,1.01)}}.squirt{animation:squirt 1.2s ease-out infinite}.squirt2{animation:squirt 1.2s ease-out -.6s infinite}@keyframes squirt{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx,-12px),10px)}}.drift{animation:drift 14s linear infinite}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(340px)}}.roll{animation:drift 9s linear infinite}.shake{animation:shake .5s ease-in-out infini